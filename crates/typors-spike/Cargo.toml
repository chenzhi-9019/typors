[package]
name = "typors-spike"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "spike"
description = "typors M0 hybrid-editor feasibility spike (research record, independent of the product crates)"

[dependencies]
gpui-fps.workspace = true
gpui-kit.workspace = true
pulldown-cmark.workspace = true
